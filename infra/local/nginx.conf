pid /tmp/nginx.pid;
events {}
http {
  # Stock nginx error logs can include OIDC callback query/code.
  # Preserve HTTP failures in a query-free operational log instead.
  log_format safe 'gateway_id=$request_id method=$request_method status=$status';
  access_log /dev/stdout safe;
  error_log /dev/null;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=10r/m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  map "$status:$uri" $auth_retry_after { "429:/auth/login" 6; default ""; }
  server {
    listen 8080;
    server_name localhost;
    client_max_body_size 64k;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:3000;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Retry-After $auth_retry_after always;
    location = /auth/login {
      limit_req zone=auth_limit burst=10 nodelay;
      limit_req_status 429;
      proxy_pass $api_upstream;
      proxy_set_header Host $http_host;
    }
    location /auth/ { proxy_pass $api_upstream; proxy_set_header Host $http_host; }
    location ~ ^/api/v1/candidates/[0-9a-fA-F-]+/documents$ {
      client_max_body_size 11m;
      proxy_request_buffering off;
      proxy_read_timeout 40s;
      proxy_pass $api_upstream; proxy_set_header Host $http_host;
    }
    location /api/v1/ { proxy_pass $api_upstream; proxy_set_header Host $http_host; }
    location = /ready { proxy_pass $api_upstream; }
    location / { proxy_pass $web_upstream; proxy_set_header Host $http_host; }
  }
}
