name: ${COMPOSE_PROJECT_NAME:-recruitment-local}
services:
  gateway:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    user: '1001:1001'
    entrypoint: [nginx, -g, 'daemon off;']
    ports: ['127.0.0.1:${APP_PORT:-3000}:8080']
    volumes: ['./infra/local/nginx.conf:/etc/nginx/nginx.conf:ro']
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
  web:
    build: ./apps/web
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777','/app/.next/cache:size=32m,uid=1001,gid=1001']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
  api:
    build: ./services/api
    environment:
      APP_ORIGIN: http://localhost:${APP_PORT:-3000}
      OIDC_ISSUER: http://idp.recruitment.localhost:${IDP_PORT:-18080}/realms/recruitment
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run setup}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run setup}
      ATTEMPT_KEY: ${ATTEMPT_KEY:?Run setup}
      CSRF_KEY: ${CSRF_KEY:?Run setup}
      PDF_SHARED_KEY: ${PDF_SHARED_KEY:?Run setup}
      SCAN_SHARED_KEY: ${SCAN_SHARED_KEY:?Run setup}
      DRAFT_MASTER_KEY: ${DRAFT_MASTER_KEY:?Run setup}
      UPLOAD_TICKET_KEY: ${UPLOAD_TICKET_KEY:?Run setup}
    networks: [default,pdf,scan]
    volumes: ['resumes:/data/resumes','${LOCAL_CONFIG_DIR:-./.local}/upload-public.pem:/run/upload-public.pem:ro']
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      db: {condition: service_healthy}
      idp: {condition: service_healthy}
      pdf-renderer: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, 'http://127.0.0.1:8080/ready']
      interval: 5s
      timeout: 7s
      retries: 12
    mem_limit: 256m
  db:
    build: ./services/postgres
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run setup}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Run setup}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run setup}
    volumes: ['app-db:/var/lib/postgresql/data','./infra/local/db-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro']
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, recruitment]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  idp:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: [start-dev, --import-realm, '--http-port=${IDP_PORT:-18080}', --health-enabled=true]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://idp-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDP_DB_PASSWORD:?Run setup}
      KC_HOSTNAME: http://idp.recruitment.localhost:${IDP_PORT:-18080}
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDP_ADMIN_PASSWORD:?Run setup}
    ports: ['127.0.0.1:${IDP_PORT:-18080}:${IDP_PORT:-18080}']
    networks:
      default: {aliases: [idp.recruitment.localhost]}
    volumes: ['${LOCAL_CONFIG_DIR:-./.local}/realm.json:/opt/keycloak/data/import/recruitment-realm.json:ro','./infra/local/idp-health.sh:/opt/keycloak/idp-health.sh:ro']
    depends_on:
      idp-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, /opt/keycloak/idp-health.sh]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 1g
  idp-db:
    build: ./services/postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDP_DB_PASSWORD:?Run setup}
    volumes: ['idp-db:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD, pg_isready, -U, keycloak, -d, keycloak]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  pdf-renderer:
    environment:
      PDF_SHARED_KEY: ${PDF_SHARED_KEY:?Run setup}
    build: ./services/pdf-renderer
    networks: [pdf]
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt: ['no-new-privileges:true','seccomp=./infra/local/pdf-seccomp.json']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1536m
    shm_size: 256m
    cpus: 2
    pids_limit: 256
  scan:
    build: ./services/av
    environment:
      SCAN_SHARED_KEY: ${SCAN_SHARED_KEY:?Run setup}
    networks: [scan]
    volumes: ['signatures:/signatures:ro']
    read_only: true
    tmpfs: ['/tmp:size=384m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 2g
    cpus: 1
    pids_limit: 32
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  updater:
    build: ./services/av
    command: [updater.py]
    healthcheck:
      test: [CMD, python3, -c, 'from common import read_manifest,fresh; assert fresh(read_manifest())']
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [av-egress]
    volumes: ['signatures:/signatures']
    read_only: true
    tmpfs: ['/tmp:size=384m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 4g
    cpus: 1
    pids_limit: 32
networks:
  av-egress: {}
  scan: {internal: true}
  pdf: {internal: true}
volumes:
  app-db:
  idp-db:
  resumes:
  signatures:
