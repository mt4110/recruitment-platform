name: recruitment-local
services:
  gateway:
    image: nginx:1.30.1-alpine@sha256:c819f83c54b0361f5557601bf5eb4943d09360e7a7fdf426afc466570f45874d
    user: '1001:1001'
    entrypoint: [nginx, -g, 'daemon off;']
    ports: ['127.0.0.1:3000:8080']
    volumes: ['./infra/local/nginx.conf:/etc/nginx/nginx.conf:ro']
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
  web:
    build: ./apps/web
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777','/app/.next/cache:size=32m,uid=1001,gid=1001']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
  api:
    build: ./services/api
    environment:
      APP_ORIGIN: http://localhost:3000
      OIDC_ISSUER: http://idp.recruitment.localhost:18080/realms/recruitment
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run setup}
      ATTEMPT_KEY: ${ATTEMPT_KEY:?Run setup}
      CSRF_KEY: ${CSRF_KEY:?Run setup}
    networks: [default,pdf]
    volumes: ['resumes:/data/resumes']
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      db: {condition: service_healthy}
      idp: {condition: service_healthy}
      pdf-renderer: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, 'http://127.0.0.1:8080/ready']
      interval: 5s
      timeout: 7s
      retries: 12
    mem_limit: 256m
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run setup}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Run setup}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run setup}
    volumes: ['app-db:/var/lib/postgresql/data','./infra/local/db-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro']
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, recruitment]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  idp:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: [start-dev, --import-realm, --http-port=18080, --health-enabled=true]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://idp-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDP_DB_PASSWORD:?Run setup}
      KC_HOSTNAME: http://idp.recruitment.localhost:18080
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDP_ADMIN_PASSWORD:?Run setup}
    ports: ['127.0.0.1:18080:18080']
    networks:
      default: {aliases: [idp.recruitment.localhost]}
    volumes: ['./.local/realm.json:/opt/keycloak/data/import/recruitment-realm.json:ro','./infra/local/idp-health.sh:/opt/keycloak/idp-health.sh:ro']
    depends_on:
      idp-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, /opt/keycloak/idp-health.sh]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 1g
  idp-db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDP_DB_PASSWORD:?Run setup}
    volumes: ['idp-db:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD, pg_isready, -U, keycloak, -d, keycloak]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  pdf-renderer:
    build: ./services/pdf-renderer
    networks: [pdf]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
networks:
  pdf: {internal: true}
volumes:
  app-db:
  idp-db:
  resumes:
