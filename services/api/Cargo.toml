[package]
name = "recruitment-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["multipart"] }
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["serde"] }
hmac = "=0.13.0"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
rand = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "derive", "json"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
