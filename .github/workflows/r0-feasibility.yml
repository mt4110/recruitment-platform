name: R0 isolated feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Require native Linux amd64
        run: python -c "import platform; assert platform.system() == 'Linux' and platform.machine() == 'x86_64'"
      - name: Prepare existing browser dependency
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium --only-shell
      - name: Probe old-key restore and resource limits only
        run: |
          mkdir -p .local/r0-ci
          node validation/r0/key_probe.cjs .local/r0-ci/keys
          python validation/r0/resource_probe.py .local/r0-ci/resources.json
          python validation/r0/inventory.py validation/r0/fixtures .local/r0-ci/xlsx-inventory.json
          python validation/r0/sheets_policy_probe.py .local/r0-ci/sheets-policy.json
      - name: Probe native Debian ClamAV and real generation transition
        run: python validation/r0/followup_av.py .local/r0-ci/av-followup
      - name: Preserve bounded evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r0-feasibility-amd64
          path: |
            .local/r0-ci/keys/keys.json
            .local/r0-ci/resources.json
            .local/r0-ci/xlsx-inventory.json
            .local/r0-ci/sheets-policy.json
            .local/r0-ci/av-followup/result.json
            .local/r0-ci/av-followup/*.log
          include-hidden-files: true
